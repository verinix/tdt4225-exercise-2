services:
  mysql:
    image: mysql:8.0.39

    ports:
      - "127.0.0.1:3306:3306"

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: tdt4225
      MYSQL_USER: tdt4225
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
